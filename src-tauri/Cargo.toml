[package]
name = "notevoro"
version = "2.0.0"
description = "Notevoro — local-first knowledge, productivity and AI workspace"
edition = "2021"
rust-version = "1.77"

[lib]
name = "notevoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"
chrono = "0.4"
anyhow = "1.0"

[features]
default = []
