name: Desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd frontend && yarn install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTEVORO_API_URL: ${{ secrets.NOTEVORO_API_URL }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Notevoro ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
